name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: format + lint + typecheck + test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tsc imports from `generated/prisma`, which is gitignored. Generate it
      # before any step that compiles TypeScript.
      - run: npx prisma generate

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      # The tests are all pure unit tests that never hit the DB, but importing
      # any module transitively pulls in src/lib/prisma.ts which throws at
      # module load if DATABASE_URL is missing. A dummy URL satisfies the
      # guard — Prisma doesn't connect until a query actually runs, which
      # no test does.
      - name: Vitest
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: npm test
