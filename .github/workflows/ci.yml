name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    # Keep this name short and stable — it's what shows up in the branch
    # protection "Required status checks" search.
    name: ci
    runs-on: ubuntu-latest

    services:
      # Integration tests run against a real Postgres. pgvector image is
      # required — migrations create vector columns and an HNSW index.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: clothes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Surface known-vulnerable production dependencies. Non-blocking while
      # the existing backlog is triaged; drop continue-on-error once clean.
      - name: npm audit (high+)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      # tsc imports from `generated/prisma`, which is gitignored. Generate it
      # before any step that compiles TypeScript.
      - run: npx prisma generate

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      # The tests are all pure unit tests that never hit the DB, but importing
      # any module transitively pulls in src/lib/prisma.ts which throws at
      # module load if DATABASE_URL is missing. A dummy URL satisfies the
      # guard — Prisma doesn't connect until a query actually runs, which
      # no test does.
      - name: Vitest
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: npm test

      # Endpoint tests against the pgvector service container above. The suite
      # migrates the throwaway DB, then exercises auth, authz isolation,
      # pagination clamps, swipes, messages (unread counts), and collections.
      - name: Vitest (integration, real Postgres)
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/clothes_test
        run: npm run test:integration
